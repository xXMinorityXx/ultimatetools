<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Command Center</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-glow"></div>

  <div class="dashboard-container view-all" id="dashboard">
    <div class="glass-panel panel-clock">
      <h2 id="greeting">Good Day</h2>
      <div id="clock">00:00:00 AM</div>
      <div id="date">Loading date...</div>
    </div>

    <div class="glass-panel panel-timer">
      <h3>⏱️ Focus Timer</h3>
      <div id="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="start-timer-btn" class="btn btn-primary">Start</button>
        <button id="pause-timer-btn" class="btn btn-secondary">Pause</button>
        <button id="reset-timer-btn" class="btn btn-danger">Reset</button>
      </div>
      <div class="stats-box">
        <span>Total Focused Today: <strong id="total-focus-time">0</strong> mins</span>
      </div>
    </div>

    <div class="glass-panel panel-links">
      <h3>🔗 Quick Links</h3>
      <div id="links-grid" class="links-grid"></div>
      <form id="add-link-form" class="inline-form">
        <input type="text" id="link-title" placeholder="Site Title" required />
        <input type="url" id="link-url" placeholder="https://..." required />
        <button type="submit" class="btn btn-accent">+</button>
      </form>
    </div>

    <div class="glass-panel panel-notes">
      <h3>📝 Cloud Scratchpad</h3>
      <textarea id="scratchpad" placeholder="Type quick notes, links, or class codes... (Auto-saves to cloud)"></textarea>
      <span id="scratchpad-status" class="status-indicator">Synced</span>
    </div>

    <div class="glass-panel panel-tasks">
      <h3>✅ Task Tracker</h3>
      <form id="add-task-form" class="inline-form">
        <input type="text" id="task-input" placeholder="New assignment..." required />
        <select id="task-category-select">
          <option value="General">General</option>
          <option value="Math">Math</option>
          <option value="CS">CS</option>
          <option value="History">History</option>
          <option value="Personal">Personal</option>
        </select>
        <button type="submit" class="btn btn-primary">Add Task</button>
      </form>

      <div class="task-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <ul id="task-list" class="task-list"></ul>
    </div>
  </div>

  <nav class="floating-dock">
    <button class="dock-item active" data-view="view-all">
      <span class="icon">🏠</span>
      <span class="label">Overview</span>
    </button>
    <button class="dock-item" data-view="view-focus">
      <span class="icon">⏱️</span>
      <span class="label">Timer</span>
    </button>
    <button class="dock-item" data-view="view-tasks">
      <span class="icon">✅</span>
      <span class="label">Tasks</span>
    </button>
    <button class="dock-item" data-view="view-notes">
      <span class="icon">📝</span>
      <span class="label">Notes</span>
    </button>
  </nav>

  <script type="module" src="script.js"></script>
</body>
</html>
