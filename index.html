<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ultimate Desk Suite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- FOCUS NUDGE -->
  <div id="focus-nudge-popup" class="focus-nudge-banner" style="display: none;">
    <div class="nudge-content">
      <span class="nudge-icon">🚨</span>
      <div>
        <div class="nudge-title">Focus Warning</div>
        <div class="nudge-msg">Are you still working?</div>
      </div>
    </div>
    <div class="nudge-actions">
      <button class="action-btn" onclick="hideNudge()">I'm Focusing</button>
    </div>
  </div>

  <div class="desktop-wrapper">
    <!-- DASHBOARD -->
    <section id="home" class="page active-page">
      <div class="home-desktop-grid">
        <div class="widget-card col-12" style="text-align: center;">
          <div class="widget-title" style="justify-content: center;">
            <span>DESK TIME</span>
            <span style="font-size:0.75rem; cursor:pointer;" onclick="toggleTimeFormat()">(12H / 24H)</span>
          </div>
          <div id="clock-time" style="font-size: 4rem; font-weight: 800;">00:00:00</div>
          <div id="clock-date" style="color: var(--oneui-text-sub); font-size: 1.1rem;">Loading...</div>
        </div>
        
        <div class="widget-card col-7">
          <div class="widget-title">📌 Priority Tasks</div>
          <div id="home-priority-tasks">Loading tasks...</div>
        </div>

        <div class="widget-card col-5" style="text-align: center;">
          <div class="widget-title">⏱️ Focus Timer</div>
          <div id="home-timer-val" style="font-size: 3rem; font-weight: 800; margin: 10px 0;">25:00</div>
          <div style="display: flex; gap: 8px; justify-content: center;">
            <button class="action-btn" onclick="startTimer()">Start</button>
            <button class="action-btn secondary" onclick="pauseTimer()">Pause</button>
            <button class="action-btn secondary" onclick="resetTimer()">Reset</button>
          </div>
        </div>

        <div class="widget-card col-12">
          <div class="widget-title">📝 Quick Notes</div>
          <textarea id="quick-note" placeholder="Jot down notes here..." style="height: 90px;" oninput="saveQuickNote()"></textarea>
        </div>
      </div>
    </section>

    <!-- CALCULATOR -->
    <section id="calc" class="page">
      <div class="glass-card">
        <h2 class="oneui-header-title">Calculator</h2>
        <div class="calc-desktop-grid">
          <div>
            <div id="calc-display" class="calc-display">0</div>
            <div class="calc-grid">
              <button class="op-btn" onclick="clearCalc()">C</button>
              <button class="op-btn" onclick="pressCalc('(')">(</button>
              <button class="op-btn" onclick="pressCalc(')')">)</button>
              <button class="op-btn" onclick="pressCalc('/')">÷</button>
              <button onclick="pressCalc('7')">7</button>
              <button onclick="pressCalc('8')">8</button>
              <button onclick="pressCalc('9')">9</button>
              <button class="op-btn" onclick="pressCalc('*')">×</button>
              <button onclick="pressCalc('4')">4</button>
              <button onclick="pressCalc('5')">5</button>
              <button onclick="pressCalc('6')">6</button>
              <button class="op-btn" onclick="pressCalc('-')">-</button>
              <button onclick="pressCalc('1')">1</button>
              <button onclick="pressCalc('2')">2</button>
              <button onclick="pressCalc('3')">3</button>
              <button class="op-btn" onclick="pressCalc('+')">+</button>
              <button onclick="pressCalc('0')">0</button>
              <button onclick="pressCalc('.')">.</button>
              <button onclick="backspaceCalc()">⌫</button>
              <button onclick="solveCalc()" style="background: var(--oneui-pill-active);">=</button>
            </div>
          </div>
          <div>
            <h4>History</h4>
            <div id="calc-history" class="calc-history"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- PLANNER -->
    <section id="tasks" class="page">
      <div class="glass-card">
        <h2 class="oneui-header-title">Homework Planner</h2>
        
        <div class="task-form-grid">
          <input type="text" id="task-name" placeholder="1. Task Name" />
          <select id="task-subject">
            <option value="" disabled selected>2. Subject...</option>
            <option value="Math">Math</option><option value="Science">Science</option>
            <option value="English">English</option><option value="History">History</option>
            <option value="Other">Other</option>
          </select>
          <select id="task-type">
            <option value="" disabled selected>3. Task Type...</option>
            <option value="Homework">Homework</option><option value="Study">Study</option>
          </select>
          <select id="task-tier">
            <option value="Tier 1">4. Tier 1: Urgent</option>
            <option value="Tier 2" selected>4. Tier 2: Medium</option>
            <option value="Tier 3">4. Tier 3: Low</option>
          </select>
          <input type="date" id="task-date" />
          <select id="task-difficulty">
            <option value="" disabled selected>6. Difficulty...</option>
            <option value="1">1 - Easy</option><option value="5">5 - Hard</option>
          </select>
          <input type="number" id="task-est-time" placeholder="7. Est. Time (Mins)" />
          <input type="text" id="task-notes" placeholder="8. Notes" class="span-2" />
          <button class="action-btn span-full" onclick="addTask()">+ Assign Task</button>
        </div>

        <div id="tiered-task-board"></div>
      </div>
    </section>

    <!-- HISTORY -->
    <section id="history" class="page">
      <div class="glass-card">
        <h2 class="oneui-header-title">Session History</h2>
        <div id="history-board"></div>
        <button class="action-btn secondary" onclick="clearHistory()" style="margin-top: 16px;">Clear History</button>
      </div>
    </section>
  </div>

  <!-- DOCK -->
  <div class="dock-wrapper">
    <nav class="oneui-dock">
      <button class="dock-tile tile-home active" id="btn-home" onclick="switchPage('home')">🏠</button>
      <button class="dock-tile tile-calc" id="btn-calc" onclick="switchPage('calc')">🔢</button>
      <button class="dock-tile tile-tasks" id="btn-tasks" onclick="switchPage('tasks')">📋</button>
      <button class="dock-tile tile-timer" id="btn-history" onclick="switchPage('history')">🕰️</button> 
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
