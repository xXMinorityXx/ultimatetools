<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-grid">
        
        <!-- Panel 1: Live Clock -->
        <div class="glass-panel clock-panel">
            <h1 id="time-display">00:00</h1>
            <p id="date-display">Loading date...</p>
        </div>

        <!-- Panel 2: Quick Links -->
        <div class="glass-panel links-panel">
            <h2>School Hub</h2>
            <div class="link-buttons">
                <a href="https://classroom.google.com" target="_blank" class="vivid-btn blue">Classroom</a>
                <a href="https://docs.google.com" target="_blank" class="vivid-btn pink">Docs</a>
                <a href="https://slides.google.com" target="_blank" class="vivid-btn orange">Slides</a>
                <a href="https://mail.google.com" target="_blank" class="vivid-btn green">Gmail</a>
            </div>
        </div>

        <!-- Panel 3: Pomodoro Timer -->
        <div class="glass-panel timer-panel">
            <h2>Focus Timer</h2>
            <div id="timer-display">25:00</div>
            <div class="timer-controls">
                <button id="start-btn" class="vivid-btn blue">Start</button>
                <button id="reset-btn" class="vivid-btn pink">Reset</button>
            </div>
        </div>

        <!-- Panel 4: Task Tracker -->
        <div class="glass-panel task-panel">
            <h2>Tasks</h2>
            <div class="task-input-area">
                <input type="text" id="task-input" placeholder="New assignment...">
                <button id="add-task-btn" class="vivid-btn green">Add</button>
            </div>
            <ul id="task-list"></ul>
        </div>

    </div>

    <!-- Links your JavaScript logic -->
    <script type="module" src="script.js"></script>
</body>
</html>
